name: RAI Attribution

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  score:
    name: Score and publish the badge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # full history is the scoring input; a shallow clone hard-fails
          fetch-depth: 0

      - name: Score commits and publish badge
        uses: anchildress1/rai-commit-badge@4116096f0a33a6ac8bf3daafcd239fa548328e99 # v1.0.0
        with:
          style: for-the-badge
